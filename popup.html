<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cookie Security Monitor</title>

  <!-- Your popup.css (optional but recommended) -->
  <link rel="stylesheet" href="popup.css" />

  <!-- Small fallback styles so it’s usable even without popup.css -->
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 10px; min-width: 720px; }
    .controls { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
    .status { opacity: .75; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #eee; padding: 6px 8px; text-align: left; font-size: 12px; }
    th { background: #fafafa; position: sticky; top: 0; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .chip { padding: 2px 6px; border-radius: 10px; border: 1px solid #ddd; display: inline-block; margin-right: 4px; font-size: 11px; }
    .chip.bad { border-color: #e68; background: #ffeef3; }
    .chip.good { border-color: #6a6; background: #f2fff2; }
    #diffPanel { border: 1px solid #eee; border-radius: 8px; padding: 10px; margin: 10px 0; }
    details summary { cursor: pointer; }
  </style>
</head>
<body>

  <!-- Controls -->
  <div class="controls">
    <button id="refreshBtn">Refresh</button>

    <label style="display:inline-flex; gap:6px; align-items:center;">
      <input type="checkbox" id="compareMode" />
      Compare mode
    </label>

    <button id="saveBefore" disabled>Save BEFORE</button>
    <button id="saveAfter"  disabled>Save AFTER</button>
    <button id="clearSnapshots" disabled>Clear</button>
    <button id="openWorkspace">Open Compare Page</button>

  </div>

  <!-- URL + status -->
  <div id="url" style="font-weight:600; overflow-wrap:anywhere;"></div>
  <div id="status" class="status" style="margin-bottom:6px;"></div>

  <!-- Diff panel (hidden until both snapshots exist) -->
  <div id="diffPanel" hidden>
    <div style="font-weight:600; margin-bottom:6px;">Cookie changes (BEFORE → AFTER)</div>
    <div id="diffMeta" class="status" style="margin-bottom:6px;"></div>
    <ul id="diffSummary" style="margin:6px 0; padding-left:18px;"></ul>

    <details>
      <summary>Show details</summary>
      <table class="cookies" style="margin-top:6px;">
        <thead>
          <tr>
            <th>Change</th>
            <th>Name</th>
            <th>Domain</th>
            <th>Path</th>
            <th>Secure</th>
            <th>HttpOnly</th>
            <th>SameSite</th>
            <th>Expires</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody id="diffBody"></tbody>
      </table>
    </details>
  </div>

  <!-- Current cookies table -->
  <table id="cookiesTable" class="cookies">
    <thead>
      <tr>
        <th>Name</th>
        <th>Value</th>
        <th>Domain</th>
        <th>Expires</th>
        <th>Secure</th>
        <th>HttpOnly</th>
        <th>SameSite</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <!-- Your logic -->
  <script src="popup.js"></script>
</body>
</html>
